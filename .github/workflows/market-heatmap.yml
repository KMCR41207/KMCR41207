name: Update market heatmap

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 04:15 UTC — offset from the other workflows
    - cron: '15 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stock-market heatmap SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_heatmap.py

      - name: Commit updated heatmap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/market-heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh developer market heatmap'
            git push
          fi
