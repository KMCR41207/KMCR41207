name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '11 1 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate looping blue contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KMCR41207
          outputs: |
            assets/github-snake.svg?palette=github-dark&color_snake=#245BDB

      - name: Commit updated snake
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh contribution snake'
            git push
          fi
