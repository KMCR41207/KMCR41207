name: Update terminal profile

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate terminal-style SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_terminal.py

      - name: Commit updated terminal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/terminal-profile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh terminal profile'
            git push
          fi
